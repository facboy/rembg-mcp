[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rembg-mcp"
version = "0.1.0"
description = "MCP server for rembg background removal"
authors = [{name = "Cory", email = "changrong185@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "rembg[cpu,cli]>=2.0.0",
    "pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["rembg_mcp*"]

[project.optional-dependencies]
gpu = ["rembg[gpu,cli]>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
rembg-mcp = "rembg_mcp.server:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true